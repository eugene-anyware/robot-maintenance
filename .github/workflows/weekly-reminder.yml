name: Weekly Teams Reminder

on:
  schedule:
    # 2:00 PM EST every Monday (1) and Thursday (4)
    - cron: '0 19 * * 1,4'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Weekly Reminder to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          DATE=$(date -u +"%A, %B %-d, %Y")
          curl -s -o /dev/null -w "%{http_code}" -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"type\": \"message\",
              \"attachments\": [{
                \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                \"contentUrl\": null,
                \"content\": {
                  \"\$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\",
                  \"type\": \"AdaptiveCard\",
                  \"version\": \"1.4\",
                  \"body\": [
                    {\"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"🔧 Weekly Robot Maintenance — $DATE\", \"color\": \"Warning\"},
                    {\"type\": \"TextBlock\", \"text\": \"Complete these tasks for **each robot** this week:\", \"wrap\": true},
                    {\"type\": \"TextBlock\", \"weight\": \"Bolder\", \"text\": \"Weekly Tasks:\", \"spacing\": \"Medium\"},
                    {\"type\": \"TextBlock\", \"text\": \"☐  System wipe down\\n☐  Dragons inspected\\n☐  Gripper inspected\\n☐  IOLink Inspected\\n☐  Operator station cleaned\", \"wrap\": true},
                    {\"type\": \"TextBlock\", \"text\": \"Log completed maintenance at your Robot Maintenance Tracker.\", \"wrap\": true, \"spacing\": \"Medium\", \"isSubtle\": true}
                  ]
                }
              }]
            }"
